name: Обновить расписание

on:
  schedule:
    # каждые 15 минут (GitHub может немного задерживать запуски)
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "parser/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: parser/requirements.txt

      - run: pip install -r parser/requirements.txt

      - name: Диагностика страницы ВАВТ
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request, re
          q = urllib.parse.urlencode({
              "f": "Бакалавриат",
              "o": "Очная форма обучения",
              "n": "ФВМ",
              "k": "1 курс",
          })
          url = "https://www.vavt.ru/schedule/?" + q
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (vavt-schedule widget; +https://github.com)"})
          html = urllib.request.urlopen(req, timeout=60).read().decode("utf-8", "replace")
          print("URL:", url)
          print("HTML bytes:", len(html.encode("utf-8")))
          print("_items_ blocks:", len(re.findall(r'_items_', html)))
          print("class with two:", len(re.findall(r'class=[\"\'][^\"\']*\btwo\b', html)))
          links = re.findall(r'href=[\"\']([^\"\']*/upload/schedule/[^\"\']+)[\"\']', html, re.I)
          print("schedule PDF links:", len(links))
          for href in links:
              name = urllib.parse.unquote(href.split("?")[0].rsplit("/", 1)[-1])
              if "ММВЯ" in name.upper():
                  print("ММВЯ PDF:", name)
          PY

      - name: Скачать и разобрать PDF
        run: |
          mkdir -p data
          python parser/vavt_schedule.py \
            --group "${{ vars.GROUP || 'Б26М-ММВЯ.2' }}" \
            --faculty "${{ vars.FACULTY || 'ФВМ' }}" \
            --course "${{ vars.COURSE || '1 курс' }}" \
            --profile "${{ vars.PROFILE || 'ММВЯ' }}" \
            --json data/schedule.json \
            --text data/schedule.txt

      - name: Закоммитить, если расписание поменялось
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "Без изменений"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Обновить расписание"
          git push
